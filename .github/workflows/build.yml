name: Build moon-lander AppImage

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
  workflow_dispatch:
    inputs:
      version:
        description: "AppImage version label (e.g. 1.0-10)"
        required: false
        default: "1.0-10"

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    # Built on Arch so the full SDL 1.2 stack and the sharun/uruntime tooling
    # are available. The resulting AppImage bundles its own libc, so the build
    # host distro does not constrain where it runs. Official Arch is x86_64-only,
    # so the arm64 leg uses the community Arch Linux ARM image (digest-pinned).
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            image: archlinux:latest
          - runner: ubuntu-24.04-arm
            image: lopsided/archlinux@sha256:bb1e4b4a564126c7d91c63813a3d3afe34334ec5dd15285ed8b574c88e23fbde

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git icoutils quilt patchelf wget zsync \
            sdl12-compat sdl_image sdl_mixer fuse2 strace xorg-server-xvfb

      - name: Checkout
        uses: actions/checkout@v7

      - name: Get VERSION from .env
        run: |
          VERSION=$(grep '^VERSION=' .env | cut -d= -f2)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Build AppImage
        run: ./make-appimage.sh
        env:
          VERSION: ${{ github.event.inputs.version || env.VERSION }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Set env vars
        run: |
          ARCH=$(uname -m)
          echo "ARCH=${ARCH}" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=moon-lander-AppImage-${ARCH}" >> $GITHUB_ENV

      - name: Upload AppImage artifact
        if: ${{ github.ref != 'refs/heads/trunk' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./out/*AppImage*
          if-no-files-found: error

      - name: Release (trunk snapshot)
        if: ${{ github.ref == 'refs/heads/trunk' }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./out/*AppImage*"
          body: |
            Snapshot release of the moon-lander AppImage, built automatically from the
            [moon-lander Salsa repo](https://salsa.debian.org/games-team/moon-lander).

            This is an [Anylinux AppImage](https://github.com/pkgforge-dev/Anylinux-AppImages):
            it bundles its own C library and runs on any Linux distribution,
            including musl-based and very old systems.

            ## Usage

            ```
            chmod +x moon-lander-*.AppImage
            ./moon-lander-*.AppImage
            ```

            ## Updating

            If you have [appimageupdatetool](https://github.com/AppImageCommunity/AppImageUpdate)
            installed, the AppImage can update itself:

            ```
            appimageupdatetool moon-lander-*.AppImage
            ```
          allowUpdates: true
          prerelease: false
          removeArtifacts: false
          replacesArtifacts: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          tag: latest
          token: ${{ secrets.GITHUB_TOKEN }}
