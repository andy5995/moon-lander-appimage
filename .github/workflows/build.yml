name: Build moon-lander AppImage

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
  workflow_dispatch:
    inputs:
      version:
        description: "AppImage version label (e.g. 1.0-10)"
        required: false
        default: "1.0-10"

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm

    env:
      VERSION: ${{ github.event.inputs.version || '1.0-10' }}
      WORKSPACE: ${{ github.workspace }}
      DOCKER_BUILD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Pull linuxdeploy builder image
        run: docker pull andy5995/linuxdeploy:v3-jammy

      - name: Build AppImage
        run: |
          export HOSTUID=$(id -u)
          export HOSTGID=$(id -g)
          docker compose -f ./docker-compose.yml run --rm build
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Create sha1sum and set env vars
        run: |
          ARCH=$(uname -m)
          echo "ARCH=${ARCH}" >> $GITHUB_ENV
          cd out
          file=$(ls *.AppImage)
          sha256sum "$file" > "$file.sha256sum"

      - name: Set artifact name
        run: echo "ARTIFACT_NAME=moon-lander-AppImage-${ARCH//\//-}" >> $GITHUB_ENV

      - name: Upload AppImage artifact
        if: ${{ github.ref != 'refs/heads/trunk' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./out/*AppImage*
          if-no-files-found: error

      - name: Release (trunk snapshot)
        if: ${{ github.ref == 'refs/heads/trunk' }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./out/*AppImage*"
          body: |
            Snapshot release of the moon-lander AppImage, built automatically from the
            [moon-lander Salsa repo](https://salsa.debian.org/games-team/moon-lander).

            ## Usage

            ```
            chmod +x moon-lander-*.AppImage
            ./moon-lander-*.AppImage
            ```

            ## Updating

            If you have [appimageupdatetool](https://github.com/AppImageCommunity/AppImageUpdate)
            installed, the AppImage can update itself:

            ```
            appimageupdatetool moon-lander-*.AppImage
            ```
          allowUpdates: true
          prerelease: true
          removeArtifacts: false
          replacesArtifacts: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          tag: snapshot
          token: ${{ secrets.GITHUB_TOKEN }}
